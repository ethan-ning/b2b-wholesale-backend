# Test, build and deploy to Cloud Run.
#
# Authentication is keyless: Workload Identity Federation lets this repository exchange
# GitHub's own OIDC token for short-lived Google credentials, so there is no service
# account JSON key to store, rotate or leak. See DEPLOY.md for the one-time setup.
name: Deploy

on:
  push:
    branches: [master]
  # The portal is a separate repository; its workflow sends one of these when it changes.
  repository_dispatch:
    types: [portal-updated]
  workflow_dispatch:
    inputs:
      portal_ref:
        description: Portal ref to build (branch, tag or SHA)
        default: main

concurrency:
  # One deploy at a time, and a newer commit supersedes one still waiting. Cancelling
  # in progress is deliberately off: a half-finished deploy is worse than a slow one.
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: b2b-wholesale
  PORTAL_REPO: ethan-ning/b2b-wholesale-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Runners have Docker, so this is the whole suite: unit tests and the Postgres-backed
      # integration tests. A deploy that skipped the ones needing a database would be
      # skipping the tests that found the last three bugs.
      - run: ./gradlew build --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token for Google
    steps:
      - uses: actions/checkout@v7

      - name: Check out the portal
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PORTAL_REPO }}
          ref: ${{ github.event.client_payload.ref || inputs.portal_ref || 'main' }}
          path: portal

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build the portal
        working-directory: portal
        run: |
          npm ci
          npm run build          # tsc runs first, so a type error stops the deploy
          cp -R dist "$GITHUB_WORKSPACE/frontend-dist"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/b2b/$SERVICE"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: |
          SQL="$PROJECT_ID:$REGION:${{ vars.GCP_SQL_INSTANCE }}"
          # The origin the portal is served from. Browsers send Origin on POST even
          # same-origin, so getting this wrong fails every sign-in with 403 while every
          # page still loads — a failure that looks like a bad password. Refuse to deploy
          # rather than ship that: an empty list rejects everyone.
          ORIGINS="${{ vars.PUBLIC_ORIGIN }}"
          if [ -z "$ORIGINS" ]; then
            echo "PUBLIC_ORIGIN is not set. Add it as a repository variable, e.g."
            echo "  PUBLIC_ORIGIN = https://portal.example.com"
            exit 1
          fi
          # --set-env-vars uses ^##^, not ^@^: the mail settings carry email
          # addresses, and @ as the delimiter would split them in half. No value
          # below contains #. (A comment between \-continued lines would end the
          # command, so it belongs here rather than inline.)
          gcloud run deploy "$SERVICE" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/b2b/$SERVICE:$GITHUB_SHA" \
            --region="$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances="$SQL" \
            --min-instances=1 --no-cpu-throttling \
            --memory=1Gi --cpu=1 --timeout=300 \
            --vpc-egress=all-traffic --network=b2b --subnet=b2b \
            --set-env-vars="^##^DB_URL=jdbc:postgresql:///b2b?cloudSqlInstance=$SQL&socketFactory=com.google.cloud.sql.postgres.SocketFactory##DB_USER=b2b##SELLFOX_SCHEDULE_ENABLED=true##APP_CORS_ALLOWED_ORIGINS=$ORIGINS##APP_IMAGES_BUCKET=woltaphor-b2b-images##APP_MAIL_HOST=smtppro.zoho.sg##APP_MAIL_PORT=587##APP_MAIL_USERNAME=admin@woltaphor.com##APP_MAIL_FROM=no-reply@woltaphor.com" \
            --set-secrets="DB_PASSWORD=b2b-db-password:latest,JWT_SECRET=b2b-jwt-secret:latest,SELLFOX_APP_ID=sellfox-app-id:latest,SELLFOX_APP_SECRET=sellfox-app-secret:latest,APP_MAIL_PASSWORD=b2b-mail-password:latest"

      - name: Check it answers
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"

          # Cloud Run reports the revision ready once the container holds the port, which
          # a Spring Boot app does before its health indicators agree it is up — so the
          # first request after a deploy can legitimately be a 503. Poll rather than fail
          # the release on a race we already know about.
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/actuator/health" || true)"
            [ "$code" = "200" ] && break
            echo "health: $code (attempt $attempt)"
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "Health never reached 200 — last status $code"
            exit 1
          fi

          # Both halves, because the image carries both and either can break alone.
          curl -fsS -o /dev/null "$URL/admin/login"
          # The brand images live outside the bundler's output directory, so they are
          # covered by their own rule. A 401 here means that rule went missing again.
          curl -fsS -o /dev/null "$URL/brand/logo-horizontal.png"
          echo "Deployed: $URL"
