# ─── Project coordinates ─────────────────────────────────────────────────────
group=com.acme.b2b
version=0.1.0-SNAPSHOT

# ─── Toolchain and framework versions ────────────────────────────────────────
# The JDK every module compiles, tests and runs against. Determines the bytecode.
java.version=21
# Plugin versions are wired in settings.gradle.kts (pluginManagement), because the
# plugins {} block cannot read project properties directly. Dotted names cannot use
# Gradle's `by project` / `by settings` delegates either, so both are read explicitly
# via providers.gradleProperty(...).
kotlin.version=2.2.21
# Also applied as the Spring Boot BOM, which constrains every Spring, Jackson and
# Hibernate version transitively — so individual dependencies are declared without one.
spring-boot.version=3.5.0

# ─── How the build runs ──────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
