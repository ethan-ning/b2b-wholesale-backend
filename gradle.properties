# Project coordinates. Gradle reads these into every project's `group` and `version`,
# which is why they are here rather than in build.gradle.kts.
group=com.acme.b2b
version=0.1.0-SNAPSHOT

# How the build runs. Deliberately separate from what the build depends on — library and
# plugin versions live in gradle/libs.versions.toml, where they get type-safe accessors
# and cannot be silently overridden by -P flags, environment variables or a stale
# ~/.gradle/gradle.properties.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
