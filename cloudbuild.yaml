# Builds the one image and deploys it to Cloud Run.
#
# The portal is a separate repository, so this clones it rather than assuming a shared
# checkout. Pin _FRONTEND_REF to a tag when you want a release to be reproducible; on main
# it tracks whatever the portal's default branch holds.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SQL_INSTANCE=PROJECT:us-central1:b2b

substitutions:
  _SERVICE: b2b-wholesale
  _REGION: us-central1
  _FRONTEND_REPO: https://github.com/ethan-ning/b2b-wholesale-frontend.git
  _FRONTEND_REF: main
  # PROJECT_ID:REGION:INSTANCE of the Cloud SQL instance.
  _SQL_INSTANCE: ''

steps:
  - id: portal
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        git clone --depth 1 --branch "$_FRONTEND_REF" "$_FRONTEND_REPO" /tmp/portal
        cd /tmp/portal
        npm ci
        npm run build          # runs tsc first, so a type error fails the build
        cp -R dist /workspace/frontend-dist

  - id: image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/b2b/$_SERVICE:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/b2b/$_SERVICE:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$PROJECT_ID/b2b/$_SERVICE]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/b2b/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated          # the app authenticates; Cloud Run does not
      - --add-cloudsql-instances=$_SQL_INSTANCE
      # Always one instance, with CPU. The nightly sync is a background thread on a timer:
      # scaled to zero it never fires, and throttled between requests it would crawl.
      - --min-instances=1
      - --no-cpu-throttling
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      # ^@^ so the JDBC URL's own & and ? survive; the default separator is a comma and
      # the URL contains none, but the delimiter has to be declared to use anything else.
      - --set-env-vars=^@^DB_URL=jdbc:postgresql:///b2b?cloudSqlInstance=$_SQL_INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory@DB_USER=b2b@SELLFOX_SCHEDULE_ENABLED=true
      - --set-secrets=DB_PASSWORD=b2b-db-password:latest,JWT_SECRET=b2b-jwt-secret:latest,SELLFOX_APP_ID=sellfox-app-id:latest,SELLFOX_APP_SECRET=sellfox-app-secret:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/b2b/$_SERVICE:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
