# Production. Every secret is required with no fallback: an unset variable fails
# startup with the property named, rather than silently falling back to a development
# credential that happens to be in version control.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
  flyway:
    # A migration that has been edited after being applied elsewhere is a deployment
    # accident; fail rather than diverge between environments.
    validate-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.acme.b2b: INFO

# Health for the load balancer; nothing else exposed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
