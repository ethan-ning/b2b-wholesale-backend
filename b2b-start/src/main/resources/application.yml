# Settings that are true in every environment. Anything that varies — credentials,
# log levels, pool sizes — belongs in a profile, not here.
spring:
  application:
    name: b2b-wholesale
  # A bare `java -jar` is a developer running it locally. Production sets
  # SPRING_PROFILES_ACTIVE=prod explicitly.
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only checks it
    open-in-view: false     # no lazy loading in the web layer — repositories return aggregates
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Migrations ship in b2b-infrastructure, beside the DOs whose tables they create.
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    ttl-minutes: ${JWT_TTL_MINUTES:480}
