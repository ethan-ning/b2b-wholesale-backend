spring:
  application:
    name: b2b-wholesale
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/b2b}
    username: ${DB_USER:b2b}
    password: ${DB_PASSWORD:b2b}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
    open-in-view: false       # No lazy loading in the web layer — repositories return aggregates
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.acme.b2b: DEBUG
