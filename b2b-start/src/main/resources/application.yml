# Production configuration. This is the baseline: running with no profile gives you
# production settings, so a deployment that forgets to set one fails loudly rather
# than quietly starting on developer defaults.
#
# Local development is the deviation — see application-local.yml.
spring:
  application:
    name: b2b-wholesale

  # No fallbacks. An unset variable must not resolve to something that happens to be
  # in version control. RequiredSettingsCheck reports which one is missing before any
  # bean is built.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only checks it
    open-in-view: false     # no lazy loading in the web layer — repositories return aggregates
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    # Migrations ship in b2b-infrastructure, beside the DOs whose tables they create.
    locations: classpath:db/migration
    # A migration edited after being applied elsewhere is a deployment accident.
    validate-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:480}

# Sellfox ERP. Credentials have no fallback for the same reason the database has none.
sellfox:
  base-url: ${SELLFOX_BASE_URL:https://openapi.sellfox.com}
  client-id: ${SELLFOX_APP_ID}
  client-secret: ${SELLFOX_APP_SECRET}
  request-timeout-seconds: ${SELLFOX_TIMEOUT_SECONDS:60}
  # How long a RUNNING row must have sat there before startup calls it dead. Only has to
  # exceed the longest legitimate run; a full sync pages the catalogue in a couple of
  # minutes. Too short and a starting instance would close a live run on another one.
  run-stale-after: ${SELLFOX_RUN_STALE_AFTER:PT15M}
  schedule:
    # Off unless asked for. Safe on several instances now — the database allows one run at
    # a time — but it needs an instance alive with CPU when the cron fires, which a
    # scale-to-zero platform does not promise. See the README.
    enabled: ${SELLFOX_SCHEDULE_ENABLED:false}
    # Stock, hourly at five past. Reads only the selected warehouses.
    inventory-cron: ${SELLFOX_INVENTORY_CRON:0 5 * * * *}
    # Everything, nightly at 02:15. Pages the whole catalog and deactivates what has left
    # the scope — a couple of minutes of paced calls, so not more often than daily.
    full-cron: ${SELLFOX_FULL_CRON:0 15 2 * * *}
    zone: ${SELLFOX_SCHEDULE_ZONE:America/Chicago}

server:
  port: ${SERVER_PORT:8080}

# Whether this deployment carries the portal as well as the API. The container image sets
# it; running the API alone leaves it off, because in development Vite serves the portal
# and forwarding unknown paths to an index.html that is not there would only confuse.
app:
  serve-spa: ${APP_SERVE_SPA:false}

logging:
  level:
    root: INFO
    com.acme.b2b: INFO

# Health for the load balancer; nothing else exposed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
