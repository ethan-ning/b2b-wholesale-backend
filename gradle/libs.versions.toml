# Single source of truth for versions. Modules reference aliases only — no version
# literals in any build.gradle.kts.
[versions]
# The toolchain every module compiles, tests and runs against. Feeds jvmToolchain(),
# so this line alone determines the bytecode — independent of the machine's default JDK.
java = "21"
kotlin = "2.2.21"
springBoot = "3.5.0"

[libraries]
# Gradle-native dependency management: the Spring Boot BOM is applied as a platform,
# which constrains every Spring/Jackson/Hibernate version transitively.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-context = { module = "org.springframework:spring-context" }

jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql" }
h2 = { module = "com.h2database:h2" }

[bundles]
spring-web = ["spring-boot-starter-web", "jackson-kotlin"]
persistence = ["spring-boot-starter-jpa", "postgresql", "flyway-core", "flyway-postgres"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
